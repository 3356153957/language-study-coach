<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:32px 16px;background:#f5f5fa;color:#252531;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <table role="presentation" style="width:100%;max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
      <tr><td>
        <p style="margin:0 0 24px;color:#6559d9;font-size:14px">Language Study Coach</p>
        <h1 style="margin:0 0 16px;font-size:24px">登录验证码</h1>
        <p style="margin:0 0 24px;line-height:1.7">在应用中输入下方验证码，继续你的学习记录。</p>
        <p style="margin:0 0 24px;padding:20px;background:#f0edff;border-radius:12px;text-align:center;color:#5144c8;font-size:32px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
        <p style="margin:0;color:#6b6b78;font-size:13px;line-height:1.7">如果不是你发起的登录，请忽略此邮件。请勿向他人提供验证码。</p>
      </td></tr>
    </table>
  </body>
</html>
